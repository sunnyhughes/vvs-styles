name = "vvs-styles"
main = "src/worker/index.ts"
compatibility_date = "2026-05-13"
account_id = "68ac97ce8c0b4e8a007aa81433a1e264"

# Keep the *.workers.dev URL live. Adding `routes` below makes Wrangler assume
# we manage routing ourselves and it DISABLES the workers.dev URL unless this is
# explicitly true. (Learned the hard way: the first deploy with the routes below
# 404'd the whole site on workers.dev.)
workers_dev = true

# Custom domains. Cloudflare creates the DNS records and issues the certificate
# on `wrangler deploy` — BUT only if the hostname has no conflicting DNS records
# already. If vv-styles.com / www already have A/CNAME records, the attach fails
# with API error 100117 ("externally managed DNS records") — delete those
# records in the Cloudflare DNS dashboard first (keep MX/TXT for email), then
# redeploy. Custom domains match the hostname EXACTLY, so the apex does not
# cover `www`; both are listed.
[[routes]]
pattern = "vv-styles.com"
custom_domain = true

[[routes]]
pattern = "www.vv-styles.com"
custom_domain = true

[assets]
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "vvs-styles"
# Placeholder ID — fine for local dev (`wrangler dev`) and Vitest (Miniflare),
# which key off `database_name`. Before the first `wrangler deploy`, run
# `wrangler d1 create vvs-styles` and paste the real ID it prints here.
database_id = "1ebb4f68-24c1-4052-b4a8-4d40157de8d8"

# Public runtime config. STRIPE_PUBLISHABLE_KEY is designed to live in client
# JS — Stripe prefixes it `pk_` ("publishable") to make that explicit. The
# secret key (`sk_...`) is NOT here; it lives in `.dev.vars` locally and is
# set via `wrangler secret put STRIPE_SECRET_KEY` in production.
[vars]
STRIPE_PUBLISHABLE_KEY = "pk_live_51TY6KYAZyNYHbgj16EZEg9tSh4v0SHj9jtZZrRwzC3tzqNReAn7GsvYUh16CjYlJ1QtSsx5vmtGICkdiRXIByKn7001qKkyv8x"

# Phase 4 fulfillment config (non-secret). The matching secrets —
# RESEND_API_KEY and PRINTIFY_API_TOKEN — go via `wrangler secret put`, not
# here. With any of these unset the worker degrades to the manual founder
# fulfillment path, so the store stays functional before Printify/email are
# wired. Uncomment + fill with real values to go live.
EMAIL_FROM = "orders@vv-styles.com"               # verified Resend sender
FOUNDER_EMAIL = "esohcreationsllc@gmail.com"      # where manual-order alerts go
PRINTIFY_SHOP_ID = "27707024"                     # custom-integration shop (API order submission)
